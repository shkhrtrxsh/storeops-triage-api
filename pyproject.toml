[project]
name = "storeops-triage-api"
version = "0.1.0"
description = "FastAPI service for triaging retail store operations incidents with structured LLM classification, ambiguity routing, and SQLite persistence."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.32.0",
    "pydantic>=2.9.0",
    "httpx>=0.27.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
